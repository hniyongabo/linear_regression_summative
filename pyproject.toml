[project]
name = "linear-regression-summative"
version = "0.1.0"
description = "Predicting electricity access percentage using World Bank data, deployed via FastAPI and a Flutter mobile app."
requires-python = ">=3.10"
dependencies = [
    "pandas",
    "numpy",
    "scikit-learn",
    "matplotlib",
    "seaborn",
    "joblib",
    "fastapi",
    "uvicorn",
    "pydantic",
    "python-multipart",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"